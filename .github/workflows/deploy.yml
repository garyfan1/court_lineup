name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # A missing variable would otherwise produce a green build and a blank white
      # page: the app throws on load and nothing in CI notices. Fail loudly instead.
      - name: Check the build is configured
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          fail=0
          [ -n "$URL" ] || { echo "::error::Repository variable VITE_SUPABASE_URL is not set (Settings > Secrets and variables > Actions > Variables)"; fail=1; }
          [ -n "$KEY" ] || { echo "::error::Repository variable VITE_SUPABASE_PUBLISHABLE_KEY is not set"; fail=1; }
          case "$URL" in
            */rest/v1|*/rest/v1/) echo "::error::VITE_SUPABASE_URL must be the project URL, not the REST endpoint. Drop the /rest/v1 suffix."; fail=1 ;;
          esac
          case "$KEY" in
            sb_secret_*) echo "::error::That is the SECRET key. It bypasses RLS and must never be built into a public bundle. Use the sb_publishable_ key."; fail=1 ;;
          esac
          exit $fail
      - run: npm run build
        env:
          # Repository *variables*, not secrets: both of these ship inside the
          # bundle and are public by design. Storing them as secrets would imply a
          # protection that does not exist. The secret key and DB password are
          # never referenced here and must never be.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
